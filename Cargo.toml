[package]
name = "hitman"
version = "0.12.0"
edition = "2021"
description = "A command line tool for hitting API endpoints"
license = "MIT"
homepage = "https://github.com/ropez/hitman"
repository = "https://github.com/ropez/hitman"

[dependencies]
chrono = "0.4.31"
clap = { version = "4.4", features = ["derive"] }
futures = "0.3"
inquire = { version = "0.9.4", features = ["date"] }
jsonpath = "0.1"
log = { version = "0.4.20", features = ["std"] }
reqwest = { version = "0.13.5", features = ["json", "cookies", "stream"] }
cookie = { version = "0.18.0" }
serde_json = "1.0"
termcolor = "1.4.0"
thiserror = "2.0.3"
tokio = { version = "1", features = ["full", "rt"] }
toml = "1.1.8"
toml_edit = "0.25"
walkdir = "2"
notify = "8.2.0"
spinoff = { version = "0.8.0", features = ["dots"] }
anyhow = "1.0.78"
fuzzy-matcher = "0.3.7"
graphql-parser = "0.4.0"
minijinja = { version = "3.0.3", features = ["json", "serde"] }
oauth2 = { version = "5", features = ["reqwest"] }
open = "5"
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-native-roots"] }
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
http = "1"
prost = "0.14"
prost-types = "0.14"
tower-lsp = "0.20"
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "hitman-lsp"
path = "src/hitman_lsp.rs"

[dev-dependencies]
mktemp = "0.5.1"
