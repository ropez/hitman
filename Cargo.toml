[package]
name = "hitman"
version = "0.12.0"
edition = "2024"
description = "A command line tool for hitting API endpoints"
license = "MIT"
homepage = "https://github.com/ropez/hitman"
repository = "https://github.com/ropez/hitman"

[[bin]]
name = "hitman"
path = "src/main.rs"

[[bin]]
name = "hitman-ui"
path = "src/main_ui.rs"

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
httparse = "1.10"
inquire = { version = "0.9.4", features = ["date"] }
jsonpath = "0.1"
log = { version = "0.4.29", features = ["std"] }
reqwest = { version = "0.13.2", features = ["json", "cookies", "stream"] }
cookie = { version = "0.18.1" }
serde_json = "1.0"
termcolor = "1.4.1"
thiserror = "2.0.18"
tokio = { version = "1", features = ["full", "rt"] }
toml = "1.0"
walkdir = "2"
notify = "8.2.0"
spinoff = { version = "0.8.0", features = ["dots"] }
anyhow = "1.0.102"
crossterm = "0.28.1"
ratatui = "0.29.0"
fuzzy-matcher = "0.3.7"
tui-input = "0.11.1"
syntect-tui = "3.0.6"
syntect = "5.3.0"
graphql-parser = "0.4.1"

[dev-dependencies]
mktemp = "0.5.1"
