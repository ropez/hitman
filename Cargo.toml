[package]
name = "hitman"
version = "0.12.0"
edition = "2021"
description = "A command line tool for hitting API endpoints"
license = "MIT"
homepage = "https://github.com/ropez/hitman"
repository = "https://github.com/ropez/hitman"

[dependencies]
chrono = "0.4.31"
clap = { version = "4.4", features = ["derive"] }
futures = "0.3"
httparse = "1.8"
inquire = { version = "0.7.5", features = ["date"] }
jsonpath = "0.1"
log = { version = "0.4.20", features = ["std"] }
reqwest = { version = "0.12.9", features = ["json", "cookies", "stream"] }
cookie = { version = "0.18.0" }
serde_json = "1.0"
termcolor = "1.4.0"
thiserror = "2.0.3"
tokio = { version = "1", features = ["full", "rt"] }
toml = "0.8"
walkdir = "2"
notify = "7.0.0"
spinoff = { version = "0.8.0", features = ["dots"] }
anyhow = "1.0.78"
fuzzy-matcher = "0.3.7"
graphql-parser = "0.4.0"
minijinja = { version = "2", features = ["json"] }

[dev-dependencies]
mktemp = "0.5.1"
